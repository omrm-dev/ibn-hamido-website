<style>
body{margin:0}
.lk{--brand:#2B4AA5;--brand-ink:#213C8C;--deep:#13245A;--on-deep:#DCE3F5;--ink:#13245A;--ink-2:#4B5675;--teal:#127A80;--ice:#E3F3F6;--ice-2:#CBE7EC;--err:#B42318;

.lk-b .hours-row{border-bottom:2px solid #13245A}
.owner-box{margin:0;padding:24px;border:2px dashed var(--in-b);border-radius:12px;background:var(--paper);color:var(--ink-2);line-height:26px}

.board .eyebrow{color:var(--ink)}
.lk-b .board .eyebrow{color:var(--accent)}

.rv{margin:0;display:flex;flex-direction:column;gap:16px;padding:24px;border-radius:16px;border:1px solid rgba(255,255,255,.22)}

.nv-links{display:flex;flex-wrap:wrap;align-items:center;gap:4px 24px}

      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg>
      Menu
    </button>

  <sc-if value="{{hasTile}}" hint-placeholder-val="{{true}}">
  <svg aria-hidden="true" width="100%" height="34" style="display: block;">
    <defs>
      <pattern id="tl-nav" width="34" height="34" patternUnits="userSpaceOnUse">
        <rect width="34" height="34" fill="#2B4AA5"></rect>
        <polygon points="17,4 21,13 30,17 21,21 17,30 13,21 4,17 13,13" fill="#F5EEE2"></polygon>
        <rect x="11" y="11" width="12" height="12" fill="#2B4AA5" transform="rotate(45 17 17)"></rect>
        <circle cx="17" cy="17" r="3" fill="#F2C14E"></circle>
        <circle cx="0" cy="0" r="3" fill="#F2C14E"></circle><circle cx="34" cy="0" r="3" fill="#F2C14E"></circle><circle cx="0" cy="34" r="3" fill="#F2C14E"></circle><circle cx="34" cy="34" r="3" fill="#F2C14E"></circle>
      </pattern>
    </defs>
    <rect width="100%" height="34" fill="url(#tl-nav)"></rect>
  </svg>
  </sc-if>
  <sc-if value="{{isB}}" hint-placeholder-val="{{false}}"><div class="awning" aria-hidden="true"></div></sc-if>
  <sc-if value="{{drawerOpen}}" hint-placeholder-val="{{false}}">
    <div class="nv-ov">
      <button type="button" class="nv-scrim" tabindex="-1" aria-hidden="true" onClick="{{closeDrawer}}"></button>
      <div id="lk-drawer" class="nv-drawer" role="dialog" aria-modal="true" aria-label="Site menu" onKeyDown="{{drawerKey}}">
        <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 8px;">
          <img src="/_blob/505e7dbf643cd914c5af3de17f72b5fd" alt="Ibn Hamido Seafood" style="height: 30px; width: auto;">
          <button type="button" class="nv-close" data-lknv-close="true" aria-label="Close menu" onClick="{{closeDrawer}}">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
          </button>
        </div>
        <a class="nv-dl" href="{{L.home}}">Home</a>
        <sc-for list="{{links}}" as="it" hint-placeholder-count="5">
          <a class="nv-dl" href="{{it.href}}" aria-current="{{it.current}}">{{it.label}}</a>
        </sc-for>
        <a class="btn btn-pri" href="{{L.order}}" style="margin-top: 16px;">Order pickup</a>
        <p style="margin: 12px 0 0; font-size: 14px; line-height: 20px; color: var(--ink-2);">Walk-in only · 14035 LaGrange Rd, Orland Park, IL</p>
      </div>
    </div>
  </sc-if>
</div>

    const current = this.props.current ?? 'home';
    const links = [
      { id: 'menu', label: 'Menu', href: lv.L.menu },
      { id: 'order', label: 'Order', href: lv.L.order },
      { id: 'story', label: 'Our Story', href: lv.L.story },
      { id: 'visit', label: 'Visit', href: lv.L.visit },
      { id: 'catering', label: 'Parties & Catering', href: lv.L.catering }
    ].map((l) => ({ ...l, current: l.id === current ? 'page' : 'false' }));
    const close = () => this.setState({ drawerOpen: false });
    return {
      ...lv,
      links,
      launchMode: this.props.launchMode ?? true,
      drawerOpen: this.state.drawerOpen,
      expanded: this.state.drawerOpen ? 'true' : 'false',
      openDrawer: () => { try { this.lastFocus = document.activeElement; } catch (e) {} this.setState({ drawerOpen: true }); },
      closeDrawer: close,
      drawerKey: (e) => {
        if (e.key === 'Escape') { e.stopPropagation(); close(); return; }
        if (e.key !== 'Tab') return;
        const f = Array.prototype.slice.call(e.currentTarget.querySelectorAll('a[href], button:not([disabled]):not([tabindex="-1"])'));
        if (!f.length) return;
        if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f[f.length - 1].focus(); }
        else if (!e.shiftKey && document.activeElement === f[f.length - 1]) { e.preventDefault(); f[0].focus(); }
      }
    };
  }
}
</script>
</body>
</html>
