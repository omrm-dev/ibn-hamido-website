<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>B · Anfushi market — Checkout + Confirmation</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&amp;family=Inter:wght@400;500;600&amp;family=Rakkas&amp;family=Young+Serif&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="background: #FBF8F1;">
  <dc-import name="L_Checkout" look="b" step="{{step}}" show-errors="{{showErrors}}" hint-size="100%,3100px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"step": {"editor": "enum", "default": "checkout", "options": ["checkout", "confirmed"]}, "showErrors": {"editor": "boolean", "default": false}, "$preview": {"width": 1440, "height": 3100}}'>
class Component extends DCLogic {
  renderVals() { return { step: this.props.step ?? "checkout", showErrors: this.props.showErrors ?? false }; }
}
</script>
</body>
</html>
