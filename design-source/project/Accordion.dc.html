            <h3 style="margin: 0; font-family: 'Young Serif', Georgia, serif; font-weight: 400; font-size: 28px; line-height: 34px; color: #FFFFFF;">{{item.name}}</h3>
            <p style="margin: 0; font-size: 15px; line-height: 22px; color: #E9EEF9;">{{item.desc}}</p>
            <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; margin-top: 8px;">
              <span style="font-size: 16px; font-weight: 600; color: #FFFFFF;">{{item.price}}</span>
              <a class="ac-link" href="Order.dc.html">Order this</a>
            </div>
          </div>
        </div>
      </sc-if>
      <sc-if value="{{item.collapsed}}" hint-placeholder-val="{{true}}">
        <button type="button" class="ac-btn" aria-expanded="false" aria-label="{{item.showLabel}}" onClick="{{item.select}}" style="{{item.btnStyle}}">
          <span aria-hidden="true" style="{{item.titleStyle}}">{{item.short}}</span>
        </button>
      </sc-if>
    </div>
  </sc-for>
</div>
